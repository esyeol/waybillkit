name: Carrier checks
on:
  workflow_dispatch:
  schedule:
    # 09:17 and 21:17 Asia/Seoul; remove ,12 for once daily.
    - cron: "17 0,12 * * *"
permissions:
  contents: read
concurrency:
  group: carrier-checks
  cancel-in-progress: false
jobs:
  check:
    if: vars.CARRIER_CHECKS_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contract_failure: ${{ steps.probe.outputs.contract_failure }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check selected dummy-response contracts
        id: probe
        env:
          CARRIER_PROBE_IDS: ${{ vars.CARRIER_PROBE_IDS }}
        run: node scripts/probes/check-carriers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: carrier-report
          path: .local/carrier-report.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  issues:
    needs: check
    if: vars.CARRIER_ISSUES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      repair: ${{ steps.sync.outputs.repair }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: carrier-report
          path: .local
      - uses: actions/github-script@v7
        id: sync
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { syncIssues } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/probes/issues.mjs`);
            const report = JSON.parse(readFileSync('.local/carrier-report.json', 'utf8'));
            core.setOutput('repair', await syncIssues(github, context, report));
  repair:
    needs: [check, issues]
    if: vars.CARRIER_REPAIR_ENABLED == 'true' && needs.issues.outputs.repair == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/carrier-repair.yml
    with:
      has_report: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
